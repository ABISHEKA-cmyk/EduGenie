<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>EduGenie Answer</title>

    <link
        rel="stylesheet"
        href="/static/style.css">

</head>


<body>


<header class="header">

    <div class="logo">
        🎓 EduGenie
    </div>

    <a href="/" class="home-link">
        ← Home
    </a>

</header>


<main class="answer-container">


    <div class="answer-card">


        <div class="answer-top">

            <div class="answer-icon">
                ✨
            </div>

            <div>

                <p class="small-title">
                    EDUgenie AI
                </p>

                <h1>
                    Your Answer
                </h1>

            </div>

        </div>


        <div class="question-box">

            <span>
                Your Question
            </span>

            <h2>
                {{ question }}
            </h2>

        </div>


        <div class="answer-content">

            <h3>
                🤖 EduGenie says
            </h3>

            <div class="answer-text">
                {{ answer }}
            </div>

        </div>


        <div class="answer-actions">

            <a href="/" class="back-button">
                ← Ask Another Question
            </a>

        </div>


    </div>


</main>


<footer>

    <p>🎓 EduGenie</p>

    <span>Learn • Practice • Improve</span>

</footer>


</body>

</html>
